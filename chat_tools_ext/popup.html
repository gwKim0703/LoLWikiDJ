<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 260px;
    padding: 12px 14px;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
    background: #1e1e1e;
    color: #ddd;
  }
  h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #fff;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 4px 0;
  }
  input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: #339af0;
    cursor: pointer;
  }

  /* 프로필 섹션 */
  .section-title {
    font-size: 11px;
    color: #888;
    margin: 14px 0 6px;
    padding-top: 10px;
    border-top: 1px solid #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .profile-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .profile-item:hover {
    background: #2a2a2a;
  }
  .profile-item.active {
    background: #1a3a2a;
  }
  .profile-nick {
    flex: 1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .profile-item.active .profile-nick {
    font-weight: 600;
    color: #fff;
  }
  .profile-badge {
    font-size: 10px;
    color: #51cf66;
    display: none;
    flex-shrink: 0;
  }
  .profile-item.active .profile-badge {
    display: inline;
  }
  .profile-delete {
    display: none;
    border: none;
    background: transparent;
    color: #666;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
  }
  .profile-item:hover .profile-delete {
    display: inline;
  }
  .profile-item.active .profile-delete {
    display: none;
  }
  .profile-delete:hover {
    color: #e03131;
  }
  .profile-empty {
    color: #666;
    font-size: 12px;
    padding: 4px 0;
  }

  /* 버전 섹션 */
  .ver-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ver-name {
    flex: 1;
    font-size: 13px;
    color: #fff;
  }
  .ver-src {
    color: #888;
    font-weight: normal;
    font-size: 11px;
  }
  #updateBtn {
    border: 1px solid #3a3a3a;
    background: #2a2a2a;
    color: #ddd;
    border-radius: 5px;
    padding: 4px 9px;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #updateBtn:hover:not(:disabled) {
    background: #339af0;
    border-color: #339af0;
    color: #fff;
  }
  #updateBtn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #updateBtn.apply {
    background: #2b8a3e;
    border-color: #2b8a3e;
    color: #fff;
    font-weight: 600;
  }
  #updateBtn.apply:hover:not(:disabled) {
    background: #37b24d;
    border-color: #37b24d;
  }
  .ver-note {
    display: none;
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.5;
    color: #999;
    white-space: pre-line;
  }
  .ver-note.good { color: #51cf66; }
  .ver-note.warn { color: #ffa94d; }
</style>
</head>
<body>
  <h3>롤디칩</h3>

  <div class="section-title">프로필</div>
  <div id="profileList" class="profile-list">
    <div class="profile-empty">로그인 기록 없음</div>
  </div>

  <div class="section-title">설정</div>
  <label>
    <input type="checkbox" id="blockLivechat">
    <span>라이브챗 차단</span>
  </label>
  <label>
    <input type="checkbox" id="compactBoard">
    <span>자유게시판 컴팩트 모드 (영상 유지)</span>
  </label>
  <label>
    <input type="checkbox" id="unloadGuard">
    <span>새로고침·뒤로가기 시 이탈 확인창 표시</span>
  </label>

  <div class="section-title">버전</div>
  <div class="ver-row">
    <span class="ver-name">롤디칩 <span id="verText">–</span> <span id="verSrc" class="ver-src"></span></span>
    <button id="updateBtn">업데이트 확인</button>
  </div>
  <div id="verNote" class="ver-note"></div>

  <script src="popup.js"></script>
</body>
</html>
